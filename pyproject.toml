[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dapagliflozin-lbd"
version = "3.0.0"
description = "Literature-Based Discovery (LBD) & Signed Knowledge Graph Drug Repurposing Engine (Hetionet v1.0 + BioRED NLP + Signed NTR Flux)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Dang Quang Huy (Data & Ephemeral Session KG)", email = "huydqk25416@st.uel.edu.vn"},
    {name = "Nguyen Khang (Biomedical NLP & BioRED Engine)", email = "khangnk25416@st.uel.edu.vn"},
    {name = "Nguyen Nhat Lam (Algorithm, DWPC & Signed Graph Ranking)", email = "lamnnk25416@st.uel.edu.vn"},
    {name = "Nguyen Cong Gia Phuoc (Evaluation, Ground Truth & Human-in-the-Loop UI)", email = "phuocncgk25416@st.uel.edu.vn"}
]
dependencies = [
    "numpy>=1.26.0,<3.0.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "networkx>=3.2.0",
    "jsonschema>=4.20.0",
    "referencing>=0.30.0",
    "requests>=2.31.0",
    "PyYAML>=6.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "ruff>=0.1.0"
]

[project.scripts]
lbd-verify-team = "run_team_verification:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lbd = [
    "contracts/*.json",
    "configs/*.yaml",
    "nlp/*.pkl",
    "nlp/*.json"
]
