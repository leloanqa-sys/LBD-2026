# NLP & Relation Extraction configuration
ner:
  engine: "pubtator_v3"
  base_url: "https://www.ncbi.nlm.nih.gov/research/pubtator3-api"
  cache_dir: "data/cache/pubtator"
  batch_size: 50
re:
  provider: "groq"
  model: "llama-3.1-70b-versatile"
  temperature: 0.0
  max_retries: 5
  backoff_factor: 2.0
  fallback_model: "llama-3.1-8b-instant"
  confidence_scorer: "pubmedbert_optional"
allowed_relations:
  - "INHIBITS"
  - "ACTIVATES"
  - "CAUSES"
  - "INCREASES"
  - "DECREASES"
  - "ASSOCIATED_WITH"
  - "TREATS"
  - "PALLIATES"
