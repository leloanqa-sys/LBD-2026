# =============================================================================
# NLP & Relation Extraction Configuration
# =============================================================================
# Production NLP Architecture:
#   - NER: PubTator 3.0 API & Regex Grounding
#   - RE: Zoned Pooling MultiClass BioRE Engine (V3) on BioRED + Optional Groq LLM Verifier
#   - Polarity & Fusion: Layer 4 Polarity FSM + Layer 5 Bayesian Fusion Engine
ner:
  engine: "pubtator_v3"
  base_url: "https://www.ncbi.nlm.nih.gov/research/pubtator3-api"
  cache_dir: "data/cache/pubtator"
re:
  provider: "groq"
  model: "llama-3.1-70b-versatile"
  temperature: 0.0
  max_retries: 5
  backoff_factor: 2.0
  fallback_model: "llama-3.1-8b-instant"
allowed_relations:
  - "INHIBITS"
  - "ACTIVATES"
  - "CAUSES"
  - "INCREASES"
  - "DECREASES"
  - "ASSOCIATED_WITH"
  - "TREATS"
  - "PALLIATES"
  - "CONTRAINDICATED_FOR"
