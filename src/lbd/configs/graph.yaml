# Knowledge Graph & Subgraph Settings
backend: "networkx"  # In-memory MultiDiGraph & sparse adjacency representation
subgraph:
  max_hops: 4
  node_types:
    - "Compound"
    - "Gene"
    - "BiologicalProcess"
    - "Pathway"
    - "Disease"
    - "Phenotype"
    - "Anatomy"
metaedges:
  - "CbG"   # Compound binds Gene
  - "CdG"   # Compound downregulates Gene
  - "CuG"   # Compound upregulates Gene
  - "GpBP"  # Gene participates in Biological Process
  - "GpPW"  # Gene participates in Pathway
  - "GaD"   # Gene associates with Disease
  - "CtD"   # Compound treats Disease
  - "CpD"   # Compound palliates Disease
